name: Pull Request

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test-reusable.yml

  # The stacks engine is its own crate (it runs in the privileged helper image), so the
  # workspace jobs above never build it. Fedora ships mkcomposefs, which its GC tests need.
  # Its mount tests need root and kernel 6.12+ (`crates/avocado-stacks/tests/integration.sh`),
  # which hosted runners do not offer.
  stacks-crate:
    name: Stacks crate
    runs-on: ubuntu-latest
    container: fedora:44
    defaults:
      run:
        working-directory: crates/avocado-stacks
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain and composefs
        run: dnf install -y --setopt=install_weak_deps=False rust cargo clippy rustfmt gcc composefs
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked

  security:
    name: Security Audit
    uses: ./.github/workflows/security-reusable.yml

  windows-check:
    name: Windows compile check
    runs-on: windows-latest
    steps:
      - name: Install build pre-reqs
        run: |
          choco install nasm cmake -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (windows-msvc)
        run: cargo check --target x86_64-pc-windows-msvc --all-targets
